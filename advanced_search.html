<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>CS50</h1>
    <hr>
    <h2>Advanced Search</h2>
    <form action="https://google.com/search" method="get" name="f">
        <div>
            <h3>All of these words:</h3>
            <input type="text" name="as_q">
        </div>
        <br>
        <h3>Exact phrase:</h3>
        <input type="text" name="as_epq"> <br>
        <h3>Any of these words:</h3>
        <input type="text" name="as_eq"> <br>
        <h3>Only from this website:</h3>
        <input type="text" name="as_sitesearch"><br>

        <input type="submit" value="Advanced Search">
    </form>
</body>
</html>
